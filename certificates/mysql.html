<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MySQL Certificate</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f2eb;
        color: #121212;
      }
      .viewer-shell { max-width: 1200px; margin: 0 auto; padding: 1.25rem; }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      h1 { margin: 0; font-size: clamp(1.4rem, 3vw, 2rem); }
      .back-link {
        color: #111111;
        text-decoration: none;
        border: 1px solid rgba(17, 17, 17, 0.12);
        border-radius: 999px;
        padding: 0.65rem 1rem;
        background: rgba(255,255,255,0.8);
      }
      .pdf-frame {
        width: 100%;
        height: 82vh;
        border: 1px solid rgba(17, 17, 17, 0.1);
        background: white;
        border-radius: 16px;
        box-shadow: 0 12px 28px rgba(17, 17, 17, 0.08);
      }
      @media (max-width: 640px) {
        .topbar { flex-direction: column; align-items: flex-start; }
        .pdf-frame { height: 72vh; }
      }
    </style>
  </head>
  <body>
    <div class="viewer-shell">
      <div class="topbar">
        <h1>MySQL Certificate</h1>
        <a class="back-link" href="../index.html">Back to portfolio</a>
      </div>

      <iframe class="pdf-frame" title="MySQL Certificate" src="../ConsoleApp1/images/MySQL%20Admin%20Certificate.pdf"></iframe>
    </div>
  </body>
</html>
